<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- AREA UTAMA -->
        <main class="main-area">

            <!-- HEADER -->
            <div id="header-container"></div>

            <!-- KONTEN DASHBOARD -->
            <section class="dashboard-content">

                <div class="welcome-section">
                    <h2>Selamat Datang, Admin Verkoop!</h2>
                    <p>Berikut ringkasan pengelolaan website Verkoop.</p>
                </div>

                <!-- KARTU STATISTIK -->
                <div class="stats-grid">

                    <div class="stat-card">
                        <div class="stat-top">
                            <span>Pengguna</span>
                            <i class="bi bi-people"></i>
                        </div>
                        <h3>6</h3>
                        <p>Total Pengguna</p>
                    </div>

                    <div class="stat-card">
                        <div class="stat-top">
                            <span>Banner</span>
                            <i class="bi bi-image"></i>
                        </div>
                        <h3>3</h3>
                        <p>Total Banner</p>
                    </div>

                    <div class="stat-card">
                        <div class="stat-top">
                            <span>Produk</span>
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <h3>10</h3>
                        <p>Total Produk</p>
                    </div>

                    <div class="stat-card">
                        <div class="stat-top">
                            <span>Mitra</span>
                            <i class="bi bi-shop"></i>
                        </div>
                        <h3>4</h3>
                        <p>Total Mitra</p>
                    </div>

                </div>

                <!-- AKSI CEPAT -->
                <section class="quick-actions">

                    <h3>Aksi Cepat</h3>

                    <div class="action-grid">

                        <a href="pages/user.html" class="action-card">
                            <i class="bi bi-person-plus"></i>
                            <span>Tambah Pengguna</span>
                        </a>

                        <a href="pages/informasi.html" class="action-card">
                            <i class="bi bi-plus-square"></i>
                            <span>Tambah Banner</span>
                        </a>

                        <a href="pages/produk.html" class="action-card">
                            <i class="bi bi-box-seam"></i>
                            <span>Tambah Produk</span>
                        </a>

                        <a href="pages/mitra.html" class="action-card">
                            <i class="bi bi-shop"></i>
                            <span>Tambah Mitra</span>
                        </a>

                    </div>

                </section>

            </section>

        </main>

    </div>

    <script src="js/admin.js"></script>

</body>
</html>
