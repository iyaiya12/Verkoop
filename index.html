<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verkoop | Kantin Jurusan Kesehatan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/tentang.css">
    <link rel="stylesheet" href="css/struktur.css">
    <link rel="stylesheet" href="css/kategori.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/whatsapp.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <main>
        <div id="banner"></div>
        <div id="tentang"></div>
        <div id="struktur"></div>
        <div id="kategori"></div>
    </main>

    <div id="footer"></div>
    
    <div id="whatsapp"></div>

<script>
    async function loadComponent(id, file) {
        try {
            const response = await fetch(file);

            if (!response.ok) {
                throw new Error(`Gagal memuat ${file}`);
            }

            const data = await response.text();
            document.getElementById(id).innerHTML = data;

        } catch (error) {
            console.error(error);
        }
    }
    
    loadLandingPage();

    function initHeaderScroll() {
    const header = document.querySelector('.main-header');

    if (!header) return;

    function handleScroll() {
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    }

    window.addEventListener('scroll', handleScroll);

    // Memeriksa posisi scroll saat halaman pertama kali dimuat
    handleScroll();
}


    async function loadLandingPage() {
        await loadComponent('header', 'components/header.html');
        initHeaderScroll();
        await loadComponent('banner', 'pages/banner.html');
        await loadComponent('tentang', 'pages/tentang.html');
        await loadComponent('struktur', 'pages/struktur.html');
        await loadComponent('kategori', 'pages/kategori.html');
        await loadComponent('footer', 'components/footer.html');
        await loadComponent('whatsapp', 'components/whatsapp.html');
    }
</script>
</body>
</html>
